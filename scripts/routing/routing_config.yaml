# =============================================================================
# PHASE 5 — ROUTE OPTIMIZATION CONFIGURATION  (scripts/routing/routing_config.yaml)
# -----------------------------------------------------------------------------
# PROJECT: Him-Drushti  —  East Prydz Bay dynamic route optimization prototype
#
# LABELLING CONVENTION  (every value below is one of):
#   * PROTOTYPE CONFIGURATION — chosen for demonstrability, NOT claimed to be
#     scientifically optimal, operationally certified, or tuned against real
#     vessel operations. Adjust freely; the engine is fully deterministic and
#     re-runnable.
#   * EMPIRICAL — carried forward from a measured Phase 3C result.
#   * HEURISTIC — documented prototype rule (not a validated law).
#   * CONVENTION — matches an existing project file (Phase 1–4).
#
# IMPORTANT:
#   * This is a PROTOTYPE DECISION-SUPPORT configuration, NOT a certified
#     maritime navigation system. No route generated by this engine is
#     guaranteed safe for navigation.
#   * The grid, weights and thresholds here are an INPUT to the deterministic
#     route optimizer (route_optimizer.py). Every parameter is named, has a
#     value, a unit (where applicable) and a description, so no important
#     parameter is buried in code.
# =============================================================================

region:
  lat_min: -70.0            # [deg N]  SOUTH bound of the East Prydz Bay prototype area  (CONVENTION: config/region.yaml)
  lat_max: -66.0            # [deg N]  NORTH bound                                           (CONVENTION: config/region.yaml)
  lon_min: 72.0             # [deg E]  WEST bound                                            (CONVENTION: config/region.yaml)
  lon_max: 80.0             # [deg E]  EAST bound                                            (CONVENTION: config/region.yaml)
  crs: "EPSG:4326"          # [--]     Geographic coordinates (WGS 84)                      (CONVENTION: config/region.yaml)
  timezone: "Antarctica/Troll"   # [--]  Reference timezone label                           (CONVENTION: config/region.yaml)

grid:
  grid_resolution_degrees: 0.05   # [deg] ~5 km x ~5 km cell. MATCHES the Phase 4
                                  #       navigation_layer resolution and config/routing.yaml
                                  #       grid_resolution_degrees (CONVENTION, Phase 4).
                                  #       PROTOTYPE resolution; NOT operational charting.
  connectivity: 8                  # [--] Grid moves: 8-connected (4 cardinal + 4 diagonal).
  start_destination_snap_cells: 3 # [cells] Max outward search so the vessel start and the
                                  #         destination snap to the nearest NAVIGABLE cell if
                                  #         they land exactly on an IMPASSABLE cell. Small,
                                  #         documented; never crosses an impassable corridor
                                  #         silently, never moves further than this many cells.

safety:
  critical_risk_threshold: 50.0   # [risk score, 0-100] HARD SAFETY CONSTRAINT: any grid cell
                                  #   whose phase-4 risk score is >= this value is IMPASSABLE.
                                  #   PROTOTYPE DECISION-SUPPORT RULE (equal to the HIGH-class
                                  #   floor so HIGH corridors cannot be crossed). Tunable; a
                                  #   value of 100 would allow (but heavily charge) HIGH cells.
  safety_buffer_km: 5.0           # [km] Distance safety margin, kept in BOTH the risk grid (it
                                  #   is already baked into the Phase 4 corridor radius) and the
                                  #   route metrics. CONVENTION: config/routing.yaml
                                  #   min_distance_from_iceberg_km = 5.0.
  moderate_class_min_score: 25.0  # [risk score] Phase 4 MODERATE floor, used only for metrics
                                  #   and the SAFE/CAUTION status rule (CONVENTION: risk_config.yaml).
  high_class_min_score: 50.0      # [risk score] Phase 4 HIGH floor (CONVENTION: risk_config.yaml).

objectives:
  # Weighted-sum objective (spec §4):
  #   TOTAL COST = safety_weight * risk_cost
  #              + distance_weight * distance_cost
  #              + time_weight     * time_cost
  #              + environment_weight * environment_cost
  # All weights are PROTOTYPE CONFIGURATION. Safety has the HIGHEST weight so
  # risk dominates the path choice; the weights are deliberately NOT claimed
  # to be scientifically optimal.
  safety_weight: 10.0       # [--] weight on risk_cost (per-cell risk_score/100). Highest priority.
  distance_weight: 1.0      # [--] weight on distance_cost (haversine km per step).
  time_weight: 1.0          # [--] weight on time_cost (step km / effective speed km/h).
                            #      NOTE: with constant vessel speed and no environmental
                            #      forcing, distance_cost and time_cost are collinear; the
                            #      time term distinguishes only when per-cell effective speed
                            #      varies (environmental speed layer supplied). It still
                            #      contributes to the reported objective cost.
  environment_weight: 1.0   # [--] weight on environment_cost (0 when no env layer supplied).
  risk_cost_scale: 100.0    # [score] divisor normalising risk_score (0-100) to cost units [0,1].

pathfinding:
  algorithm: "astar"        # [--] "astar" (preferred) or "dijkstra". A* uses an admissible
                            #      haversine heuristic (always <= true remaining cost), so it
                            #      returns the same lowest-cost route as Dijkstra while
                            #      expanding fewer cells. Deterministic tie-break in code.
  heuristic_weight_only_distance: true  # [--] Admissiblity guarantee: the heuristic is
                                        #      distance_weight * haversine(cell, dest), which
                                        #      never exceeds the true remaining cost (all other
                                        #      cost terms are non-negative).

vessel:
  speed_knots_default: 12.0  # [kn] Default vessel speed when the route request omits one.
                             #      CONVENTION: config/vessel.yaml cruising_speed (RV-DEMO).
  knots_to_kmh: 1.852        # [km/h per kn] Conversion factor (exact by definition).
  vessel_id_default: "RV-DEMO"  # [--] Label for the default prototype vessel (CONVENTION).

environment:
  # OPTIONAL environmental penalty layer. Phase 5 does NOT download any new
  # dataset (spec §23); demos run with NO environmental layer and therefore
  # with environment_cost = 0. If a caller supplies a layer of per-cell
  # penalties in [0,1], it is multiplied by environment_weight.
  require_environmental_layer: false   # [bool] when true, a request without an env layer is refused.
  sea_ice_penalty_scale: 1.0           # [--] multiplier if a sea-ice concentration layer is supplied (reserved).

output:
  json_dir: "outputs/routing/demo"     # [path rel. project root] machine-readable demo outputs.
  csv_dir: "outputs/routing/demo"
  figure_dir: "outputs/routing/figures"
  labels:                              # static disclaimer strings emitted with every output
    prototype:
      "PROTOTYPE CONFIGURATION — deterministic demo optimizer. NOT a certified maritime routing system. No route guarantee."
    travel_time:
      "PROTOTYPE TRAVEL-TIME ESTIMATE — route_km / vessel_speed only; no operational ETA."
    decision_support_rule:
      "HARD SAFETY CONSTRAINT is a PROTOTYPE DECISION-SUPPORT RULE: cells with risk_score >= critical_risk_threshold are IMPASSABLE."
    synthetic:
      "DEMO / SYNTHETIC SCENARIO — NOT real observations. No iceberg/vessel position is real."

report:
  status_safe: "SAFE"                    # [--] route Status label (spec §10).
  status_caution: "CAUTION"
  status_no_route: "NO_SAFE_ROUTE_FOUND"
  route_labels:
    last_known_state_route: "LAST-KNOWN-STATE ROUTE"  # label when data_freshness == LAST-KNOWN-STATE MODE
    nominal_route: "ROUTE"                            # label otherwise